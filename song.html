<!DOCTYPE html>
<html lang="zh-Hant">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>歌詞頁｜YanYan 歌聲收藏冊</title>
    <style>
        :root {
            --cream: #fff8e8;
            --cream-deep: #f4ead2;
            --paper: #fffdf7;
            --green: #789260;
            --green-soft: #dce9bd;
            --green-pale: #eef6d6;
            --purple: #5a4e73;
            --purple-soft: #e8dff3;
            --pink: #ec7aa2;
            --yellow: #f5d77b;
            --brown: #6f624d;
            --line: #ded0b3;
            --shadow: 0 18px 45px rgba(96, 76, 45, 0.14);
            --radius-lg: 28px;
            --radius-md: 18px;
        }

        * { box-sizing: border-box; }

        html { scroll-behavior: smooth; }

        body {
            margin: 0;
            font-family: "Noto Sans TC", "Microsoft JhengHei", "PingFang TC", system-ui, sans-serif;
            color: var(--brown);
            background:
                radial-gradient(circle at top left, rgba(220, 233, 189, 0.75), transparent 32%),
                radial-gradient(circle at top right, rgba(232, 223, 243, 0.7), transparent 30%),
                linear-gradient(180deg, #fff9e9 0%, #f8efd9 100%);
            min-height: 100vh;
        }

        a { color: inherit; text-decoration: none; }
        button, input { font: inherit; }

        .song-page {
            width: min(780px, calc(100% - 36px));
            margin: 0 auto;
            padding: 28px 0 60px;
        }

        /* ── Topbar ── */
        .topbar {
            display: flex;
            align-items: center;
            gap: 14px;
            margin-bottom: 32px;
        }

        .back-link {
            display: inline-flex;
            align-items: center;
            gap: 6px;
            padding: 10px 18px;
            border-radius: 999px;
            border: 1px solid rgba(120, 146, 96, 0.32);
            background: rgba(255, 253, 247, 0.82);
            color: var(--green);
            font-weight: 800;
            font-size: 0.92rem;
            box-shadow: 0 8px 20px rgba(94, 80, 48, 0.08);
            transition: transform 0.18s ease, background 0.18s ease;
            white-space: nowrap;
        }

        .back-link:hover {
            transform: translateY(-2px);
            background: #fff;
        }

        /* ── Song header ── */
        .song-header {
            border: 1px solid rgba(222, 208, 179, 0.72);
            background: rgba(255, 253, 247, 0.88);
            box-shadow: var(--shadow);
            border-radius: var(--radius-lg);
            padding: clamp(24px, 5vw, 40px);
            margin-bottom: 22px;
            position: relative;
            overflow: hidden;
        }

        .song-header::after {
            content: "♪";
            position: absolute;
            right: 28px;
            bottom: 4px;
            color: rgba(120, 146, 96, 0.12);
            font-size: 7rem;
            font-weight: 900;
            transform: rotate(-12deg);
            pointer-events: none;
        }

        .song-kicker {
            display: inline-flex;
            align-items: center;
            gap: 8px;
            color: var(--green);
            font-size: 0.8rem;
            font-weight: 900;
            letter-spacing: 0.12em;
            text-transform: uppercase;
            margin-bottom: 10px;
        }

        .song-name {
            margin: 0 0 8px;
            color: var(--purple);
            font-size: clamp(1.8rem, 6vw, 2.8rem);
            line-height: 1.1;
            letter-spacing: -0.03em;
        }

        .song-meta {
            color: #857a69;
            font-size: 1rem;
            font-weight: 700;
            margin-bottom: 18px;
        }

        .song-meta span {
            margin: 0 6px;
            opacity: 0.5;
        }

        .song-badges {
            display: flex;
            flex-wrap: wrap;
            gap: 8px;
        }

        .song-badge {
            display: inline-flex;
            align-items: center;
            gap: 4px;
            padding: 5px 12px;
            border-radius: 999px;
            background: var(--purple-soft);
            color: var(--purple);
            font-size: 0.82rem;
            font-weight: 900;
        }

        .song-badge.green {
            background: var(--green-pale);
            color: var(--green);
        }

        /* ── Player / Backing section ── */
        .song-section {
            border: 1px solid rgba(222, 208, 179, 0.72);
            background: rgba(255, 253, 247, 0.88);
            box-shadow: var(--shadow);
            border-radius: var(--radius-lg);
            padding: clamp(20px, 4vw, 32px);
            margin-bottom: 22px;
        }

        .section-title {
            display: flex;
            align-items: center;
            gap: 10px;
            color: var(--purple);
            font-weight: 900;
            font-size: 1rem;
            margin: 0 0 18px;
        }

        /* YT backing link */
        .backing-yt-link {
            display: inline-flex;
            align-items: center;
            gap: 10px;
            padding: 14px 24px;
            border-radius: 999px;
            background: #ff0000;
            color: #fff;
            font-weight: 900;
            font-size: 1rem;
            box-shadow: 0 8px 24px rgba(255, 0, 0, 0.25);
            transition: transform 0.18s ease, box-shadow 0.18s ease;
        }

        .backing-yt-link:hover {
            transform: translateY(-2px);
            box-shadow: 0 14px 32px rgba(255, 0, 0, 0.32);
        }

        .backing-yt-link svg {
            width: 22px;
            height: 22px;
            flex: 0 0 auto;
        }

        .backing-note {
            margin-top: 12px;
            font-size: 0.88rem;
            color: #8a7d6a;
        }

        /* Audio player */
        .audio-player {
            background: linear-gradient(145deg, rgba(220, 233, 189, 0.4), rgba(232, 223, 243, 0.25));
            border: 1px solid rgba(222, 208, 179, 0.6);
            border-radius: var(--radius-md);
            padding: 20px 22px;
        }

        .player-controls {
            display: flex;
            align-items: center;
            gap: 14px;
            margin-bottom: 14px;
        }

        .player-btn {
            width: 48px;
            height: 48px;
            border-radius: 50%;
            border: none;
            background: var(--green);
            color: #fff;
            font-size: 1.2rem;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            box-shadow: 0 6px 18px rgba(120, 146, 96, 0.32);
            transition: transform 0.16s ease, box-shadow 0.16s ease;
            flex: 0 0 auto;
        }

        .player-btn:hover {
            transform: scale(1.08);
            box-shadow: 0 10px 26px rgba(120, 146, 96, 0.4);
        }

        .player-btn:disabled {
            background: rgba(166, 141, 97, 0.35);
            box-shadow: none;
            cursor: not-allowed;
        }

        .player-time-wrap {
            flex: 1;
            min-width: 0;
        }

        .player-progress-wrap {
            position: relative;
            height: 6px;
            background: rgba(166, 141, 97, 0.25);
            border-radius: 999px;
            cursor: pointer;
            margin-bottom: 8px;
        }

        .player-progress-fill {
            height: 100%;
            background: var(--green);
            border-radius: 999px;
            width: 0%;
            transition: width 0.1s linear;
            pointer-events: none;
        }

        .player-progress-thumb {
            position: absolute;
            top: 50%;
            left: 0%;
            transform: translate(-50%, -50%);
            width: 14px;
            height: 14px;
            border-radius: 50%;
            background: var(--green);
            box-shadow: 0 2px 8px rgba(120, 146, 96, 0.4);
            pointer-events: none;
        }

        .player-times {
            display: flex;
            justify-content: space-between;
            font-size: 0.8rem;
            color: #8a7d6a;
            font-weight: 700;
        }

        .player-volume {
            display: flex;
            align-items: center;
            gap: 8px;
            margin-top: 12px;
            font-size: 0.85rem;
            color: #8a7d6a;
        }

        .player-volume input[type="range"] {
            -webkit-appearance: none;
            height: 4px;
            border-radius: 999px;
            background: rgba(166, 141, 97, 0.3);
            width: 100px;
            cursor: pointer;
            outline: none;
        }

        .player-volume input[type="range"]::-webkit-slider-thumb {
            -webkit-appearance: none;
            width: 14px;
            height: 14px;
            border-radius: 50%;
            background: var(--green);
            cursor: pointer;
        }

        .player-no-file {
            text-align: center;
            padding: 24px;
            color: #8a7d6a;
            font-size: 0.95rem;
            line-height: 1.8;
        }

        .player-no-file strong {
            display: block;
            color: var(--purple);
            margin-bottom: 6px;
            font-size: 1.05rem;
        }

        /* Lyrics */
        .lyrics-block {
            white-space: pre-line;
            line-height: 2.2;
            font-size: 1.05rem;
            color: var(--brown);
            letter-spacing: 0.02em;
        }

        .lyrics-block p {
            margin: 0 0 1.5em;
        }

        /* Not found state */
        .not-found {
            text-align: center;
            padding: 60px 24px;
            color: #8a7d6a;
            line-height: 2;
        }

        .not-found strong {
            display: block;
            color: var(--purple);
            font-size: 1.3rem;
            margin-bottom: 10px;
        }

        /* Footer */
        .footer-note {
            margin-top: 28px;
            color: #857a69;
            text-align: center;
            font-size: 0.9rem;
            line-height: 1.8;
        }

        @media (max-width: 600px) {
            .song-page {
                width: min(100% - 22px, 780px);
                padding-top: 18px;
            }

            .song-header::after { display: none; }

            .song-name {
                font-size: clamp(1.6rem, 9vw, 2.2rem);
            }

            .backing-yt-link {
                width: 100%;
                justify-content: center;
            }

            .player-volume input[type="range"] {
                width: 80px;
            }
        }
    </style>
</head>
<body>
    <main class="song-page">
        <nav class="topbar">
            <a class="back-link" href="songbook.html">← 回到歌聲收藏冊</a>
        </nav>

        <div id="songContent">
            <!-- 動態填入 -->
        </div>

        <p class="footer-note">Rawr Rawr!!! 願每一次歌聲，都被溫柔地記得。</p>
    </main>

    <script src="data/contentMap.js"></script>
    <script src="data/vodData.js"></script>
    <script src="data/songData.js"></script>
    <script src="data/songLyrics.js"></script>
    <script src="data.js"></script>
    <script>
        const params = new URLSearchParams(location.search);
        const songId = params.get('id') || '';

        const { songData = [] } = window.museumData || {};
        const songLyrics = (window.museumDataParts && window.museumDataParts.songLyrics) || [];

        const songInfo = songData.find(s => s.id === songId) || null;
        const lyricInfo = songLyrics.find(s => s.id === songId) || null;

        const container = document.getElementById('songContent');

        function escapeHtml(v) {
            return String(v || '').replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;').replace(/"/g, '&quot;');
        }

        function formatLanguage(lang) {
            const l = String(lang || '').toUpperCase().trim();
            if (l === 'ZH') return 'ZH 中文';
            if (l === 'EN') return 'EN 英文';
            if (l === 'JP') return 'JP 日文';
            return lang || '';
        }

        function renderPlayer(lyric) {
            if (!lyric) return '';

            // YT backing
            if (lyric.backingYt) {
                return `
                <div class="song-section">
                    <div class="section-title">🎵 伴奏</div>
                    <a class="backing-yt-link" href="${escapeHtml(lyric.backingYt)}" target="_blank" rel="noopener">
                        <svg viewBox="0 0 24 24" fill="currentColor"><path d="M19.59 6.69a4.83 4.83 0 0 1-3.77-4.25V2h-3.45v13.67a2.89 2.89 0 0 1-2.88 2.5 2.89 2.89 0 0 1-2.89-2.89 2.89 2.89 0 0 1 2.89-2.89c.28 0 .54.04.79.1V9.01a6.33 6.33 0 0 0-.79-.05 6.34 6.34 0 0 0-6.34 6.34 6.34 6.34 0 0 0 6.34 6.34 6.34 6.34 0 0 0 6.33-6.34V8.69a8.27 8.27 0 0 0 4.84 1.56V6.81a4.85 4.85 0 0 1-1.07-.12z"/></svg>
                        前往 YouTube 伴奏 ↗
                    </a>
                    <p class="backing-note">點擊後會在新分頁開啟 YouTube 伴奏頁面。</p>
                </div>`;
            }

            // Local audio player
            if (lyric.backingFile) {
                return `
                <div class="song-section">
                    <div class="section-title">🎵 伴奏播放器</div>
                    <div class="audio-player" id="audioPlayer">
                        <audio id="audioEl" preload="none" crossorigin="anonymous">
                            <source src="https://max817781.github.io/DinosaurMuseum2.0/${escapeHtml(encodeURI(lyric.backingFile))}" type="audio/mpeg">
                            <source src="${escapeHtml(encodeURI(lyric.backingFile))}" type="audio/mpeg">
                        </audio>
                        <div class="player-controls">
                            <button class="player-btn" id="playBtn" type="button" title="播放 / 暫停" aria-label="播放 / 暫停">▶</button>
                            <div class="player-time-wrap">
                                <div class="player-progress-wrap" id="progressWrap">
                                    <div class="player-progress-fill" id="progressFill"></div>
                                    <div class="player-progress-thumb" id="progressThumb"></div>
                                </div>
                                <div class="player-times">
                                    <span id="currentTime">0:00</span>
                                    <span id="totalTime">--:--</span>
                                </div>
                            </div>
                        </div>
                        <div class="player-volume">
                            <span>🔊</span>
                            <input type="range" id="volumeSlider" min="0" max="1" step="0.05" value="0.8" aria-label="音量">
                        </div>
                    </div>
                </div>`;
            }

            return '';
        }

        function renderLyrics(lyric) {
            if (!lyric || !lyric.lyrics) return '';
            const lines = lyric.lyrics.trim().split('\n');
            const html = lines.map(line => {
                if (line.trim() === '') return '<br>';
                return `<div>${escapeHtml(line)}</div>`;
            }).join('\n');

            return `
            <div class="song-section">
                <div class="section-title">📄 歌詞</div>
                <div class="lyrics-block">${html}</div>
            </div>`;
        }

        if (!songInfo) {
            document.title = '找不到歌曲 | YanYan 歌聲收藏冊';
            container.innerHTML = `
                <div class="not-found">
                    <strong>找不到這首歌</strong>
                    這首歌可能還沒有收錄，或連結有誤。<br>
                    <br>
                    <a class="back-link" href="songbook.html">← 回到歌聲收藏冊</a>
                </div>`;
        } else {
            document.title = `${songInfo.title}｜YanYan 歌聲收藏冊`;

            const status = songInfo.status === '待練' || songInfo.status === '練習中' ? '練習中' : (songInfo.status || '已收錄');
            const isPracticing = status === '練習中';
            const year = lyricInfo && lyricInfo.year ? lyricInfo.year + ' 年' : '';

            container.innerHTML = `
                <section class="song-header">
                    <div class="song-kicker">Song Archive</div>
                    <h1 class="song-name">${escapeHtml(songInfo.title)}</h1>
                    <div class="song-meta">
                        ${escapeHtml(songInfo.artist || '')}
                        ${year ? `<span>·</span>${escapeHtml(year)}` : ''}
                    </div>
                    <div class="song-badges">
                        <span class="song-badge">${escapeHtml(formatLanguage(songInfo.language))}</span>
                        <span class="song-badge ${isPracticing ? 'green' : ''}">${isPracticing ? '🌱 ' : ''}${escapeHtml(status)}</span>
                    </div>
                </section>

                ${renderPlayer(lyricInfo)}
                ${renderLyrics(lyricInfo)}

                ${!lyricInfo ? `
                <div class="song-section" style="text-align:center; color:#8a7d6a; padding: 30px;">
                    這首歌目前還沒有歌詞與伴奏資料。
                </div>` : ''}
            `;

            // Init audio player if exists
            const audio = document.getElementById('audioEl');
            const playBtn = document.getElementById('playBtn');
            const progressFill = document.getElementById('progressFill');
            const progressThumb = document.getElementById('progressThumb');
            const progressWrap = document.getElementById('progressWrap');
            const currentTimeEl = document.getElementById('currentTime');
            const totalTimeEl = document.getElementById('totalTime');
            const volumeSlider = document.getElementById('volumeSlider');

            if (audio && playBtn) {
                function formatTime(sec) {
                    if (!isFinite(sec)) return '--:--';
                    const m = Math.floor(sec / 60);
                    const s = Math.floor(sec % 60);
                    return `${m}:${s.toString().padStart(2, '0')}`;
                }

                function updateProgress() {
                    if (!audio.duration) return;
                    const pct = (audio.currentTime / audio.duration) * 100;
                    progressFill.style.width = pct + '%';
                    progressThumb.style.left = pct + '%';
                    currentTimeEl.textContent = formatTime(audio.currentTime);
                }

                audio.addEventListener('loadedmetadata', () => {
                    totalTimeEl.textContent = formatTime(audio.duration);
                });

                audio.addEventListener('timeupdate', updateProgress);

                audio.addEventListener('ended', () => {
                    playBtn.textContent = '▶';
                });

                audio.addEventListener('error', () => {
                    document.getElementById('audioPlayer').innerHTML = `
                        <div class="player-no-file">
                            <strong>找不到伴奏檔案</strong>
                            請確認 <code>${escapeHtml(lyricInfo.backingFile)}</code> 已放入正確位置。
                        </div>`;
                });

                playBtn.addEventListener('click', () => {
                    if (audio.paused) {
                        audio.play();
                        playBtn.textContent = '⏸';
                    } else {
                        audio.pause();
                        playBtn.textContent = '▶';
                    }
                });

                progressWrap.addEventListener('click', e => {
                    const rect = progressWrap.getBoundingClientRect();
                    const pct = (e.clientX - rect.left) / rect.width;
                    audio.currentTime = pct * audio.duration;
                    updateProgress();
                });

                volumeSlider.addEventListener('input', () => {
                    audio.volume = volumeSlider.value;
                });

                audio.volume = 0.8;
            }
        }
    </script>
</body>
</html>
