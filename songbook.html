<!DOCTYPE html>
<html lang="zh-Hant">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>YanYan 歌聲收藏冊｜恐龍諾諾博物館</title>
    <style>
        :root {
            --cream: #fff8e8;
            --cream-deep: #f4ead2;
            --paper: #fffdf7;
            --green: #789260;
            --green-soft: #dce9bd;
            --green-pale: #eef6d6;
            --purple: #5a4e73;
            --purple-soft: #e8dff3;
            --pink: #ec7aa2;
            --yellow: #f5d77b;
            --brown: #6f624d;
            --line: #ded0b3;
            --shadow: 0 18px 45px rgba(96, 76, 45, 0.14);
            --radius-lg: 28px;
            --radius-md: 18px;
        }

        * {
            box-sizing: border-box;
        }

        html {
            scroll-behavior: smooth;
        }

        body {
            margin: 0;
            font-family: "Noto Sans TC", "Microsoft JhengHei", "PingFang TC", system-ui, sans-serif;
            color: var(--brown);
            background:
                radial-gradient(circle at top left, rgba(220, 233, 189, 0.75), transparent 32%),
                radial-gradient(circle at top right, rgba(232, 223, 243, 0.7), transparent 30%),
                linear-gradient(180deg, #fff9e9 0%, #f8efd9 100%);
            min-height: 100vh;
            overflow-x: hidden;
        }

        a {
            color: inherit;
            text-decoration: none;
        }

        button,
        input {
            font: inherit;
        }

        .songbook-page {
            width: min(1180px, calc(100% - 36px));
            margin: 0 auto;
            padding: 28px 0 48px;
        }

        .topbar {
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 18px;
            margin-bottom: 28px;
        }

        .brand {
            display: flex;
            align-items: center;
            gap: 14px;
        }

        .brand img {
            width: 58px;
            height: 58px;
            object-fit: contain;
            border-radius: 20px;
            background: rgba(255, 255, 255, 0.72);
            box-shadow: 0 10px 25px rgba(104, 88, 51, 0.12);
        }

        .brand-title {
            margin: 0;
            color: var(--purple);
            font-size: clamp(1.35rem, 3vw, 2rem);
            line-height: 1.15;
        }

        .brand-subtitle {
            display: block;
            margin-top: 4px;
            color: var(--green);
            font-size: 0.94rem;
            font-weight: 700;
            letter-spacing: 0.04em;
        }

        .home-link {
            display: inline-flex;
            align-items: center;
            justify-content: center;
            gap: 6px;
            padding: 12px 18px;
            border-radius: 999px;
            border: 1px solid rgba(120, 146, 96, 0.32);
            background: rgba(255, 253, 247, 0.82);
            color: var(--green);
            font-weight: 800;
            box-shadow: 0 10px 24px rgba(94, 80, 48, 0.1);
            transition: transform 0.2s ease, background 0.2s ease;
            white-space: nowrap;
        }

        .home-link:hover {
            transform: translateY(-2px);
            background: #ffffff;
        }

        .hero {
            display: grid;
            grid-template-columns: 1.3fr 0.7fr;
            gap: 24px;
            align-items: stretch;
            margin-bottom: 28px;
        }

        .hero-copy,
        .hero-card,
        .songbook-panel {
            border: 1px solid rgba(222, 208, 179, 0.72);
            background: rgba(255, 253, 247, 0.84);
            box-shadow: var(--shadow);
            border-radius: var(--radius-lg);
        }

        .hero-copy {
            padding: clamp(24px, 5vw, 44px);
            position: relative;
            overflow: hidden;
        }

        .hero-copy::after {
            content: "♪";
            position: absolute;
            right: 34px;
            bottom: 12px;
            color: rgba(120, 146, 96, 0.16);
            font-size: 8rem;
            font-weight: 900;
            transform: rotate(-12deg);
        }

        .kicker {
            display: inline-flex;
            align-items: center;
            gap: 8px;
            color: var(--green);
            font-size: 0.82rem;
            font-weight: 900;
            letter-spacing: 0.12em;
            text-transform: uppercase;
        }

        .hero h2 {
            margin: 12px 0 14px;
            color: var(--purple);
            font-size: clamp(2rem, 6vw, 4.3rem);
            line-height: 1.05;
            letter-spacing: -0.04em;
        }

        .hero p {
            max-width: 680px;
            margin: 0;
            color: #756b5a;
            line-height: 1.9;
            font-size: 1.02rem;
        }

        .hero-card {
            padding: 26px;
            display: flex;
            flex-direction: column;
            justify-content: center;
            gap: 16px;
            min-height: 250px;
            background:
                linear-gradient(145deg, rgba(220, 233, 189, 0.66), rgba(255, 253, 247, 0.86)),
                rgba(255, 253, 247, 0.9);
        }

        .hero-card .count {
            color: var(--purple);
            font-size: clamp(2.5rem, 7vw, 5rem);
            line-height: 0.95;
            font-weight: 900;
        }

        .hero-card span {
            color: var(--green);
            font-weight: 900;
        }

        .songbook-panel {
            padding: 22px;
        }

        .controls {
            display: flex;
            justify-content: space-between;
            gap: 18px;
            align-items: center;
            margin-bottom: 18px;
        }

        .filter-row {
            display: flex;
            gap: 10px;
            flex-wrap: wrap;
        }

        .filter-btn {
            border: 0;
            cursor: pointer;
            border-radius: 999px;
            padding: 10px 18px;
            color: #5f574a;
            background: #ebe2cf;
            font-weight: 900;
            transition: transform 0.16s ease, background 0.16s ease, color 0.16s ease;
        }

        .filter-btn:hover {
            transform: translateY(-1px);
            background: var(--green-pale);
            color: var(--green);
        }

        .filter-btn.active {
            background: var(--green);
            color: #fffef8;
            box-shadow: 0 8px 20px rgba(120, 146, 96, 0.26);
        }

        .search-wrap {
            position: relative;
            min-width: min(360px, 100%);
        }

        .search-input {
            width: 100%;
            border: 1px solid rgba(166, 141, 97, 0.35);
            border-radius: 999px;
            padding: 12px 44px 12px 18px;
            color: var(--purple);
            background: rgba(255, 255, 255, 0.86);
            outline: none;
            box-shadow: inset 0 1px 0 rgba(255, 255, 255, 0.7);
        }

        .search-input:focus {
            border-color: rgba(120, 146, 96, 0.72);
            box-shadow: 0 0 0 4px rgba(220, 233, 189, 0.58);
        }

        .search-clear {
            position: absolute;
            right: 8px;
            top: 50%;
            transform: translateY(-50%);
            width: 30px;
            height: 30px;
            border: 0;
            border-radius: 50%;
            cursor: pointer;
            background: var(--cream-deep);
            color: var(--brown);
            font-size: 1.15rem;
            line-height: 1;
        }

        .search-clear:hover {
            background: var(--purple-soft);
            color: var(--purple);
        }

        .hidden {
            display: none !important;
        }

        .result-summary {
            color: #7d705c;
            font-size: 0.95rem;
            margin: 6px 0 16px;
        }

        .song-list {
            display: grid;
            gap: 12px;
            min-height: 520px;
            align-content: flex-start;
        }

        .song-row {
            display: grid;
            grid-template-columns: 1fr auto;
            gap: 16px;
            align-items: center;
            padding: 16px 18px;
            border-radius: var(--radius-md);
            border: 1px solid rgba(222, 208, 179, 0.74);
            background: rgba(255, 253, 247, 0.88);
            color: var(--brown);
            transition: transform 0.16s ease, box-shadow 0.16s ease, border-color 0.16s ease;
        }

        .song-row.has-link:hover {
            transform: translateY(-2px);
            border-color: rgba(120, 146, 96, 0.55);
            box-shadow: 0 12px 30px rgba(96, 76, 45, 0.13);
        }

        .song-main {
            min-width: 0;
        }

        .song-title-line {
            display: flex;
            align-items: baseline;
            gap: 10px;
            flex-wrap: wrap;
            margin-bottom: 8px;
        }

        .song-title {
            color: var(--purple);
            font-size: 1.08rem;
            font-weight: 900;
            line-height: 1.35;
        }

        .song-artist {
            color: #857a69;
            font-size: 0.96rem;
            font-weight: 700;
        }

        .song-tags {
            display: flex;
            flex-wrap: wrap;
            gap: 7px;
        }

        .song-badge {
            display: inline-flex;
            align-items: center;
            gap: 4px;
            padding: 5px 9px;
            border-radius: 999px;
            background: var(--purple-soft);
            color: var(--purple);
            font-size: 0.8rem;
            font-weight: 900;
            line-height: 1.2;
        }

        .song-badge.status-pending {
            background: var(--green-pale);
            color: var(--green);
        }

        .song-tag-badge {
            background: #f2ead8;
            color: #7b6b53;
        }

        .song-actions {
            display: flex;
            flex-wrap: wrap;
            justify-content: flex-end;
            gap: 8px;
            min-width: 170px;
        }

        .song-link,
        .performance-link,
        .song-muted {
            display: inline-flex;
            align-items: center;
            justify-content: center;
            border-radius: 999px;
            padding: 8px 12px;
            font-size: 0.86rem;
            font-weight: 900;
            white-space: nowrap;
        }

        .song-link {
            background: var(--green);
            color: #fffef8;
        }

        .performance-link {
            background: var(--cream-deep);
            color: var(--purple);
            border: 1px solid rgba(222, 208, 179, 0.78);
        }

        .performance-link:hover {
            background: var(--green-pale);
            color: var(--green);
        }

        .song-muted {
            background: rgba(235, 226, 207, 0.62);
            color: #887d6a;
        }

        .empty-state {
            display: flex;
            align-items: center;
            justify-content: center;
            min-height: 320px;
            border-radius: var(--radius-md);
            border: 1px dashed rgba(166, 141, 97, 0.45);
            background: rgba(255, 253, 247, 0.7);
            color: #7b705e;
            text-align: center;
            line-height: 1.8;
            padding: 24px;
        }

        .pagination {
            display: flex;
            justify-content: center;
            flex-wrap: wrap;
            gap: 8px;
            margin-top: 22px;
        }

        .pagination button,
        .pagination span {
            min-width: 38px;
            height: 38px;
            border-radius: 999px;
            border: 1px solid rgba(222, 208, 179, 0.82);
            background: rgba(255, 253, 247, 0.86);
            color: var(--brown);
            font-weight: 900;
            display: inline-flex;
            align-items: center;
            justify-content: center;
            padding: 0 12px;
        }

        .pagination button {
            cursor: pointer;
        }

        .pagination button:hover:not(:disabled) {
            background: var(--green-pale);
            color: var(--green);
        }

        .pagination button.active {
            background: var(--green);
            color: #fffef8;
        }

        .pagination button:disabled {
            opacity: 0.48;
            cursor: not-allowed;
        }

        .footer-note {
            margin-top: 22px;
            color: #857a69;
            text-align: center;
            line-height: 1.8;
            font-size: 0.92rem;
        }

        @media (max-width: 820px) {
            .songbook-page {
                width: min(100% - 22px, 1180px);
                padding-top: 18px;
            }

            .hero,
            .song-row {
                grid-template-columns: 1fr;
            }

            .topbar,
            .controls {
                flex-direction: column;
                align-items: stretch;
                gap: 14px;
            }

            .brand {
                align-items: center;
            }

            .brand img {
                width: 52px;
                height: 52px;
                flex: 0 0 auto;
            }

            .brand-title {
                font-size: 1.55rem;
            }

            .brand-subtitle {
                font-size: 0.9rem;
            }

            .home-link {
                width: 100%;
                min-height: 48px;
            }

            .hero {
                gap: 16px;
                margin-bottom: 18px;
            }

            .hero-copy {
                padding: 26px 24px;
            }

            .hero h2 {
                font-size: clamp(2.25rem, 12vw, 3.25rem);
                letter-spacing: -0.06em;
            }

            .hero p {
                font-size: 1rem;
                line-height: 1.85;
            }

            .hero-card {
                min-height: auto;
                padding: 22px 24px;
            }

            .songbook-panel {
                padding: 16px;
                border-radius: 24px;
            }

            .filter-row {
                width: 100%;
                display: grid;
                grid-template-columns: repeat(2, minmax(0, 1fr));
                gap: 10px;
            }

            .filter-btn {
                width: 100%;
                min-height: 44px;
                padding: 10px 12px;
                white-space: nowrap;
                text-align: center;
            }

            .search-wrap {
                min-width: 100%;
                width: 100%;
            }

            .search-input {
                width: 100%;
                font-size: 0.98rem;
            }

            .song-row {
                display: block;
                padding: 18px;
                border-radius: 22px;
            }

            .song-title-line {
                display: block;
            }

            .song-title {
                font-size: 1.18rem;
                margin-bottom: 8px;
                overflow-wrap: anywhere;
            }

            .song-artist {
                display: block;
                font-size: 0.98rem;
                margin-bottom: 10px;
            }

            .song-actions {
                justify-content: flex-start;
                min-width: 0;
                margin-top: 12px;
            }

            .song-link,
            .performance-link,
            .song-muted {
                min-height: 42px;
                padding: 9px 14px;
            }

            .song-list {
                min-height: 420px;
            }
        }

        @media (max-width: 430px) {
            .songbook-page {
                width: min(100% - 16px, 1180px);
                padding-top: 14px;
            }

            .brand {
                gap: 10px;
            }

            .brand img {
                width: 46px;
                height: 46px;
                border-radius: 16px;
            }

            .brand-title {
                font-size: 1.35rem;
            }

            .hero-copy {
                padding: 24px 20px;
            }

            .hero h2 {
                font-size: clamp(2rem, 11vw, 2.7rem);
            }

            .songbook-panel {
                padding: 14px;
            }

            .filter-row {
                gap: 8px;
            }

            .filter-btn {
                min-height: 42px;
                padding: 9px 8px;
                font-size: 0.92rem;
            }

            .result-summary {
                padding: 0 4px;
            }

            .song-row {
                padding: 16px;
            }
        }
    

        .song-header {
            border: 1px solid rgba(222, 208, 179, 0.72);
            background: rgba(255, 253, 247, 0.88);
            box-shadow: var(--shadow);
            border-radius: var(--radius-lg);
            padding: clamp(24px, 5vw, 40px);
            margin-bottom: 22px;
            position: relative;
            overflow: hidden;
        }

        .song-header::after {
            content: "♪";
            position: absolute;
            right: 28px;
            bottom: 4px;
            color: rgba(120, 146, 96, 0.12);
            font-size: 7rem;
            font-weight: 900;
            transform: rotate(-12deg);
            pointer-events: none;
        }

        .song-kicker {
            display: inline-flex;
            align-items: center;
            gap: 8px;
            color: var(--green);
            font-size: 0.8rem;
            font-weight: 900;
            letter-spacing: 0.12em;
            text-transform: uppercase;
            margin-bottom: 10px;
        }

        .song-name {
            margin: 0 0 8px;
            color: var(--purple);
            font-size: clamp(1.8rem, 6vw, 2.8rem);
            line-height: 1.1;
            letter-spacing: -0.03em;
        }

        .song-meta {
            color: #857a69;
            font-size: 1rem;
            font-weight: 700;
            margin-bottom: 18px;
        }

        .song-meta span {
            margin: 0 6px;
            opacity: 0.5;
        }

        .song-badges {
            display: flex;
            flex-wrap: wrap;
            gap: 8px;
        }

        .song-badge {
            display: inline-flex;
            align-items: center;
            gap: 4px;
            padding: 5px 12px;
            border-radius: 999px;
            background: var(--purple-soft);
            color: var(--purple);
            font-size: 0.82rem;
            font-weight: 900;
        }

        .song-badge.green {
            background: var(--green-pale);
            color: var(--green);
        }

        /* ── Player / Backing section ── */
        .song-section {
            border: 1px solid rgba(222, 208, 179, 0.72);
            background: rgba(255, 253, 247, 0.88);
            box-shadow: var(--shadow);
            border-radius: var(--radius-lg);
            padding: clamp(20px, 4vw, 32px);
            margin-bottom: 22px;
        }

        .section-title {
            display: flex;
            align-items: center;
            gap: 10px;
            color: var(--purple);
            font-weight: 900;
            font-size: 1rem;
            margin: 0 0 18px;
        }

        /* YT backing link */
        .backing-yt-link {
            display: inline-flex;
            align-items: center;
            gap: 10px;
            padding: 14px 24px;
            border-radius: 999px;
            background: #ff0000;
            color: #fff;
            font-weight: 900;
            font-size: 1rem;
            box-shadow: 0 8px 24px rgba(255, 0, 0, 0.25);
            transition: transform 0.18s ease, box-shadow 0.18s ease;
        }

        .backing-yt-link:hover {
            transform: translateY(-2px);
            box-shadow: 0 14px 32px rgba(255, 0, 0, 0.32);
        }

        .backing-yt-link svg {
            width: 22px;
            height: 22px;
            flex: 0 0 auto;
        }

        .backing-note {
            margin-top: 12px;
            font-size: 0.88rem;
            color: #8a7d6a;
        }

        /* Audio player */
        .audio-player {
            background: linear-gradient(145deg, rgba(220, 233, 189, 0.4), rgba(232, 223, 243, 0.25));
            border: 1px solid rgba(222, 208, 179, 0.6);
            border-radius: var(--radius-md);
            padding: 20px 22px;
        }

        .player-controls {
            display: flex;
            align-items: center;
            gap: 14px;
            margin-bottom: 14px;
        }

        .player-btn {
            width: 48px;
            height: 48px;
            border-radius: 50%;
            border: none;
            background: var(--green);
            color: #fff;
            font-size: 1.2rem;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            box-shadow: 0 6px 18px rgba(120, 146, 96, 0.32);
            transition: transform 0.16s ease, box-shadow 0.16s ease;
            flex: 0 0 auto;
        }

        .player-btn:hover {
            transform: scale(1.08);
            box-shadow: 0 10px 26px rgba(120, 146, 96, 0.4);
        }

        .player-btn:disabled {
            background: rgba(166, 141, 97, 0.35);
            box-shadow: none;
            cursor: not-allowed;
        }

        .player-time-wrap {
            flex: 1;
            min-width: 0;
        }

        .player-progress-wrap {
            position: relative;
            height: 6px;
            background: rgba(166, 141, 97, 0.25);
            border-radius: 999px;
            cursor: pointer;
            margin-bottom: 8px;
        }

        .player-progress-fill {
            height: 100%;
            background: var(--green);
            border-radius: 999px;
            width: 0%;
            transition: width 0.1s linear;
            pointer-events: none;
        }

        .player-progress-thumb {
            position: absolute;
            top: 50%;
            left: 0%;
            transform: translate(-50%, -50%);
            width: 14px;
            height: 14px;
            border-radius: 50%;
            background: var(--green);
            box-shadow: 0 2px 8px rgba(120, 146, 96, 0.4);
            pointer-events: none;
        }

        .player-times {
            display: flex;
            justify-content: space-between;
            font-size: 0.8rem;
            color: #8a7d6a;
            font-weight: 700;
        }

        .player-volume {
            display: flex;
            align-items: center;
            gap: 8px;
            margin-top: 12px;
            font-size: 0.85rem;
            color: #8a7d6a;
        }

        .player-volume input[type="range"] {
            -webkit-appearance: none;
            height: 4px;
            border-radius: 999px;
            background: rgba(166, 141, 97, 0.3);
            width: 100px;
            cursor: pointer;
            outline: none;
        }

        .player-volume input[type="range"]::-webkit-slider-thumb {
            -webkit-appearance: none;
            width: 14px;
            height: 14px;
            border-radius: 50%;
            background: var(--green);
            cursor: pointer;
        }

        .player-no-file {
            text-align: center;
            padding: 24px;
            color: #8a7d6a;
            font-size: 0.95rem;
            line-height: 1.8;
        }

        .player-no-file strong {
            display: block;
            color: var(--purple);
            margin-bottom: 6px;
            font-size: 1.05rem;
        }

        /* Lyrics */
        .lyrics-block {
            white-space: pre-line;
            line-height: 2.2;
            font-size: 1.05rem;
            color: var(--brown);
            letter-spacing: 0.02em;
        }

        .lyrics-block p {
            margin: 0 0 1.5em;
        }

        /* Not found state */
        .not-found {
            text-align: center;
            padding: 60px 24px;
            color: #8a7d6a;
            line-height: 2;
        }

        .not-found strong {
            display: block;
            color: var(--purple);
            font-size: 1.3rem;
            margin-bottom: 10px;
        }

        
    </style>
</head>
<body>
    <main class="songbook-page">
        <header class="topbar">
            <a class="brand" href="https://yanyanmuseum.pages.dev/" aria-label="回到恐龍諾諾博物館首頁">
                <img src="images/nono-chibi.png" alt="YanYan 小恐龍 Q 版圖">
                <h1 class="brand-title">
                    YanYan 歌聲收藏冊
                    <span class="brand-subtitle">Little Dino Songbook</span>
                </h1>
            </a>
            <a class="home-link" href="https://yanyanmuseum.pages.dev/">← 回到博物館</a>
        </header>

        <div id="songDetailContainer"></div>
        <section class="hero" aria-labelledby="songbook-title">
            <div class="hero-copy">
                <span class="kicker">Song Archive</span>

            if (!item || !item.id) return;

        const songResultSummary = document.getElementById('songResultSummary');
        const songPagination = document.getElementById('songPagination');
        const searchSongInput = document.getElementById('searchSongInput');
        const songSearchClearBtn = document.getElementById('songSearchClearBtn');
        const songFilterBtnContainer = document.getElementById('songFilterBtnContainer');
        const songTotalCount = document.getElementById('songTotalCount');

        let currentSongPage = 1;
        let songSearchTimer = null;

        songTotalCount.textContent = songData.length;

        function escapeHtml(value) {
            return String(value || "")
                .replace(/&/g, "&amp;")
                .replace(/</g, "&lt;")
                .replace(/>/g, "&gt;")
                .replace(/"/g, "&quot;")
                .replace(/'/g, "&#039;");
        }

        function getContent(sourceId) {
            if (!sourceId) return null;
            const content = contentMap[sourceId];
            if (!content) {
                console.warn(`songbook.html 找不到 sourceId：${sourceId}`);
                return null;
            }
            return content;
        }

        function resolveItem(item = {}) {
            return item.sourceId ? { ...getContent(item.sourceId), ...item } : item;
        }

        function getPrimaryLink(content = {}, fallback = "") {
            return content.link || content.youtube || content.xLink || fallback || "";
        }

        function normalizeSongSearchKeyword(value) {
            return String(value || "")
                .toLowerCase()
                .trim()
                .replace(/^#+/, "");
        }

        function getSongTagList(tags) {
            if (Array.isArray(tags)) {
                return tags.map(tag => String(tag || "").trim()).filter(Boolean);
            }
            return String(tags || "")
                .split(/[,，]/)
                .map(tag => tag.trim())
                .filter(Boolean);
        }

        function normalizeSongTags(tags) {
            return getSongTagList(tags).join(" ");
        }

        function getSongSearchText(song) {
            return [
                song.title,
                song.artist,
                song.singer,
                song.language,
                formatDisplayLanguage(song.language),
                song.status,
                normalizeSongTags(song.tags)
            ].join(" ").toLowerCase();
        }

        function getDisplayStatus(status) {
            if (status === "待練" || status === "練習中") return "練習中";
            return status || "已收錄";

            if (!Array.isArray(performances) || performances.length === 0) return "";

            return performances.map((performance, index) => {
                const label = performance.label || performance.date || `版本 ${index + 1}`;
                const source = getContent(performance.sourceId);
                const link = source ? getPrimaryLink(source) : "";

                if (!link) {
                    return `<span class="song-muted">${escapeHtml(label)}</span>`;
                }

                return `
                    <a class="performance-link" href="${escapeHtml(link)}" target="_blank" rel="noopener">
                        ${escapeHtml(label)} ↗
                    </a>
                `;
            }).join("");
        }

        function renderSongs(songs) {
            const html = songs.map(songItem => {
                const song = resolveItem(songItem);
                const title = song.title || "未命名歌曲";
                const artist = song.artist || song.singer || "未填歌手";
                const status = getDisplayStatus(song.status);
                const isPracticing = status === "練習中";
                const tags = getSongTagList(song.tags);
                const performances = Array.isArray(song.performances) ? song.performances : [];
                const hasPerformances = performances.length > 0;
                const link = getPrimaryLink(song);
                const statusBadge = `<span class="song-badge ${isPracticing ? "status-pending" : ""}">${isPracticing ? "🌱 " : ""}${escapeHtml(status)}</span>`;
                const tagBadges = tags

                    .join("");
                const hasLyrics = Boolean(songLyricsMap[song.id || songItem.id]);

                    ? `<a class="song-link" href="${escapeHtml(link)}" target="_blank" rel="noopener">打開紀錄 ↗</a>`

        function formatDisplayLanguage(lang) {
            if (!lang) return '';
            const l = String(lang).toUpperCase().trim();
            if (l === 'ZH' || l === '中文') return 'ZH 中文';
            if (l === 'EN' || l === '英文') return 'EN 英文';
            if (l === 'JP' || l === '日文') return 'JP 日文';
            return lang;
        }

        function isSongLanguageMatch(songLang, filterLang) {
            if (!songLang || !filterLang) return false;
            const s = String(songLang).toUpperCase().trim();
            const f = String(filterLang).toUpperCase().trim();
            if (s === f) return true;
            if ((s === 'ZH' || s === '中文') && (f === 'ZH' || f === '中文' || f.includes('ZH') || f.includes('中文'))) return true;
            if ((s === 'EN' || s === '英文') && (f === 'EN' || f === '英文' || f.includes('EN') || f.includes('英文'))) return true;
            if ((s === 'JP' || s === '日文') && (f === 'JP' || f === '日文' || f.includes('JP') || f.includes('日文'))) return true;
            return false;
        }

        function getSongPriorityScore(songItem) {
            const song = resolveItem(songItem);
            const lyric = songLyricsMap[song.id || songItem.id];
            const isCqz = String(song.artist || '').includes('陳綺貞');
            const hasBackingFile = Boolean(lyric && lyric.backingFile);

            if (isCqz && hasBackingFile) return 1;
            if (hasBackingFile) return 2;
            return 3;
        }

        function getFilteredSongData() {
            const keyword = normalizeSongSearchKeyword(searchSongInput.value);

            return songData.filter(songItem => {
                const song = resolveItem(songItem);
                const isPracticing = song.status === "待練" || song.status === "練習中";
                const matchFilter = currentSongFilter === "all"
                    || isSongLanguageMatch(song.language, currentSongFilter)
                    || (currentSongFilter === "練習中" && isPracticing);
                const matchSearch = !keyword || getSongSearchText(song).includes(keyword);

                return matchFilter && matchSearch;
            }).sort((a, b) => getSongPriorityScore(a) - getSongPriorityScore(b));
        }

        function getSongPageItems(totalPages) {
            if (totalPages <= 7) {
                return Array.from({ length: totalPages }, (_, index) => index + 1);
            }

            const pages = new Set([1, totalPages]);
            for (let page = currentSongPage - 2; page <= currentSongPage + 2; page += 1) {
                if (page > 1 && page < totalPages) pages.add(page);
            }

            return [...pages].sort((a, b) => a - b);
        }

        function renderSongPagination(totalPages) {
            songPagination.innerHTML = "";
            if (totalPages <= 1) return;

            const createPageButton = (label, page, options = {}) => {
                const button = document.createElement("button");
                button.type = "button";
                button.textContent = label;
                button.disabled = Boolean(options.disabled);
                button.classList.toggle("active", Boolean(options.active));
                button.addEventListener("click", () => changeSongPage(page));
                return button;
            };

            songPagination.appendChild(
                createPageButton("上一頁", currentSongPage - 1, { disabled: currentSongPage === 1 })

                    createPageButton(String(page), page, { active: page === currentSongPage })
                );
                previousPage = page;

                createPageButton("下一頁", currentSongPage + 1, { disabled: currentSongPage === totalPages })
            );
        }

            const hasFilter = currentSongFilter !== "all" || searchSongInput.value.trim() !== "";

return performances.map((performance, index) => {
                const label = performance.label || performance.date || `版本 ${index + 1}`;

                    return `<span class="song-muted">${escapeHtml(label)}</span>`;

                return `
                    <a class="performance-link" href="${escapeHtml(link)}" target="_blank" rel="noopener">

        function renderSongs(songs) {

                const tagBadges = tags
                    .map(tag => `<span class="song-badge song-tag-badge">#${escapeHtml(tag)}</span>`)
                    .join("");
                const hasLyrics = Boolean(songLyricsMap[song.id || songItem.id]);
                const lyricEntry = songLyricsMap[song.id || songItem.id];
                const lyricsLabel = lyricEntry && lyricEntry.backingYt && !lyricEntry.lyrics ? '🎵 伴奏' : '🎵 歌詞';
                const lyricsBtn = hasLyrics
                    ? `<a class="performance-link" href="?id=${escapeHtml(song.id || songItem.id)}">${lyricsLabel}</a>`
                    : '';

                // 有 lyricsBtn 時不能讓整個 row 是 <a>（避免 <a> 嵌套 <a>）
                const useRowLink = !hasPerformances && link && !hasLyrics;
                const rowTag = useRowLink ? "a" : "article";
                const linkAttrs = useRowLink ? `href="${escapeHtml(link)}" target="_blank" rel="noopener"` : "";
                const rowClass = `song-row ${useRowLink ? "has-link" : ""}`;

                const recordBtn = !hasPerformances && link && hasLyrics
                    ? `<a class="song-link" href="${escapeHtml(link)}" target="_blank" rel="noopener">打開紀錄 ↗</a>`

                return `
                    <${rowTag} ${linkAttrs} class="${rowClass}">

                                <div class="song-title">${escapeHtml(title)}</div>
                                <div class="song-artist">${escapeHtml(artist)}</div>

                                ${statusBadge}

                            </div>
                        </div>

        function formatDisplayLanguage(lang) {

            if (l === 'ZH' || l === '中文') return 'ZH 中文';

            return lang;

            const f = String(filterLang).toUpperCase().trim();
            if (s === f) return true;

        }

        function getFilteredSongData() {

                    <a class="backing-yt-link" href="${escapeHtml(lyricInfo.backingYt)}" target="_blank" rel="noopener">
                        <svg viewBox="0 0 24 24" fill="currentColor" style="width:22px;height:22px;flex:0 0 auto;"><path d="M19.59 6.69a4.83 4.83 0 0 1-3.77-4.25V2h-3.45v13.67a2.89 2.89 0 0 1-2.88 2.5 2.89 2.89 0 0 1-2.89-2.89 2.89 2.89 0 0 1 2.89-2.89c.28 0 .54.04.79.1V9.01a6.33 6.33 0 0 0-.79-.05 6.34 6.34 0 0 0-6.34 6.34 6.34 6.34 0 0 0 6.34 6.34 6.34 6.34 0 0 0 6.33-6.34V8.69a8.27 8.27 0 0 0 4.84 1.56V6.81a4.85 4.85 0 0 1-1.07-.12z"/></svg>
                        前往 YouTube 伴奏 ↗
                    </a>
                    <p class="backing-note">點擊後會在新分頁開啟 YouTube 伴奏頁面。</p>
                </div>`;
            } else if (lyricInfo && lyricInfo.backingFile) {
                playerHtml = `
                <div class="song-section">
                    <div class="section-title">🎵 伴奏播放器</div>
                    <div class="audio-player" id="audioPlayer">
                        <audio id="audioEl" preload="none">
                            <source src="${escapeHtml(lyricInfo.backingFile)}" type="audio/mpeg">
                        </audio>
                        <div class="player-controls">
                            <button class="player-btn" id="playBtn" type="button" title="播放 / 暫停" aria-label="播放 / 暫停">▶</button>
                            <div class="player-time-wrap">
                                <div class="player-progress-wrap" id="progressWrap">
                                    <div class="player-progress-fill" id="progressFill"></div>
                                    <div class="player-progress-thumb" id="progressThumb"></div>
                                </div>
                                <div class="player-times">
                                    <span id="currentTime">0:00</span>
                                    <span id="totalTime">--:--</span>
                                </div>
                            </div>
                        </div>
                        <div class="player-volume">
                            <span>🔊</span>
                            <input type="range" id="volumeSlider" min="0" max="1" step="0.05" value="0.8" aria-label="音量">
                        </div>
                    </div>
                </div>`;
            }

            let lyricsHtml = '';
            if (lyricInfo && lyricInfo.lyrics) {
                const lines = lyricInfo.lyrics.trim().split('\n');
                const formattedLines = lines.map(line => line.trim() === '' ? '<br>' : `<div>${escapeHtml(line)}</div>`).join('\n');
                lyricsHtml = `
                <div class="song-section">
                    <div class="section-title">📄 歌詞</div>
                    <div class="lyrics-block">${formattedLines}</div>
                </div>`;
            }

            if (detailContainer) {
                detailContainer.innerHTML = `
                    <nav class="topbar" style="margin-bottom: 20px;">
                        <a class="back-link" href="songbook.html">← 回到歌聲收藏冊</a>
                    </nav>
                    <section class="song-header">
                        <div class="song-kicker">Song Archive</div>
                        <h1 class="song-name">${escapeHtml(songInfo.title)}</h1>
                        <div class="song-meta">
                            ${escapeHtml(songInfo.artist || '')}
                            ${year ? `<span>·</span>${escapeHtml(year)}` : ''}
                        </div>
                        <div class="song-badges">
                            <span class="song-badge">${escapeHtml(formatDisplayLanguage(songInfo.language))}</span>
                            <span class="song-badge ${isPracticing ? 'green' : ''}">${isPracticing ? '🌱 ' : ''}${escapeHtml(status)}</span>
                        </div>
                    </section>

                    ${playerHtml}
                    ${lyricsHtml}

                    ${!lyricInfo ? `
                    <div class="song-section" style="text-align:center; color:#8a7d6a; padding: 30px;">
                        這首歌目前還沒有歌詞與伴奏資料。
                    </div>` : ''}
                `;

                const audio = document.getElementById('audioEl');
                const playBtn = document.getElementById('playBtn');
                const progressFill = document.getElementById('progressFill');
                const progressThumb = document.getElementById('progressThumb');
                const progressWrap = document.getElementById('progressWrap');
                const currentTimeEl = document.getElementById('currentTime');
                const totalTimeEl = document.getElementById('totalTime');
                const volumeSlider = document.getElementById('volumeSlider');

                if (audio && playBtn) {
                    function formatTime(sec) {
                        if (!isFinite(sec)) return '--:--';
                        const m = Math.floor(sec / 60);
                        const s = Math.floor(sec % 60);
                        return `${m}:${s.toString().padStart(2, '0')}`;
                    }
                    function updateProgress() {
                        if (!audio.duration) return;
                        const pct = (audio.currentTime / audio.duration) * 100;
                        progressFill.style.width = pct + '%';
                        progressThumb.style.left = pct + '%';
                        currentTimeEl.textContent = formatTime(audio.currentTime);
                    }
                    audio.addEventListener('loadedmetadata', () => {
                        totalTimeEl.textContent = formatTime(audio.duration);
                    });
                    audio.addEventListener('timeupdate', updateProgress);
                    audio.addEventListener('ended', () => { playBtn.textContent = '▶'; });
                    audio.addEventListener('error', () => {
                        const playerEl = document.getElementById('audioPlayer');
                        if (playerEl) {
                            playerEl.innerHTML = `
                                <div class="player-no-file">
                                    <strong>找不到伴奏檔案</strong>
                                    請確認 <code>${escapeHtml(lyricInfo ? lyricInfo.backingFile : '')}</code> 已放入正確位置。
                                </div>`;
                        }
                    });
                    playBtn.addEventListener('click', () => {
                        if (audio.paused) { audio.play(); playBtn.textContent = '⏸'; }
                        else { audio.pause(); playBtn.textContent = '▶'; }
                    });
                    progressWrap.addEventListener('click', e => {
                        const rect = progressWrap.getBoundingClientRect();
                        const pct = (e.clientX - rect.left) / rect.width;
                        audio.currentTime = pct * audio.duration;
                        updateProgress();
                    });
                    if (volumeSlider) {
                        volumeSlider.addEventListener('input', () => { audio.volume = volumeSlider.value; });
                    }
                    audio.volume = 0.8;
                }
            }
        }

        if (detailSongId) {
            renderSongDetailView(detailSongId);
        }

        function applySongFilters() {
            currentSongPage = 1;
            renderSongPage();
        }

        songFilterBtnContainer.addEventListener("click", event => {
            const button = event.target.closest("button[data-filter]");
            if (!button) return;

            currentSongFilter = button.dataset.filter || "all";
            songFilterBtnContainer.querySelectorAll(".filter-btn").forEach(btn => {
                btn.classList.toggle("active", btn === button);
            });
            applySongFilters();
        });

        searchSongInput.addEventListener("input", () => {
            songSearchClearBtn.classList.toggle("hidden", searchSongInput.value.length === 0);
            clearTimeout(songSearchTimer);
            songSearchTimer = setTimeout(applySongFilters, SONG_SEARCH_DEBOUNCE_MS);
        });

        songSearchClearBtn.addEventListener("click", () => {
            searchSongInput.value = "";
            songSearchClearBtn.classList.add("hidden");
            applySongFilters();
        });

        renderSongPage();
    </script>
    <script src="https://yanyanmuseum.pages.dev/js/external-link-position.js?v=20260802b"></script>
</body>
</html>
